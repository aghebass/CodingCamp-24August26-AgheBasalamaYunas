<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===== HEADER: Greeting + Clock + Theme Toggle ===== -->
  <header class="header">
    <div class="header-left">
      <h1 id="greeting">Good Morning!</h1>
      <p id="date-display" class="date-text"></p>

      <!-- Custom name row -->
      <div class="name-row" id="name-display-row">
        <span id="name-display" class="name-display"></span>
        <button id="name-edit-btn" class="btn-icon" aria-label="Edit name" title="Edit name">✏️</button>
      </div>
      <div class="name-row name-input-row" id="name-input-row" hidden>
        <input
          type="text"
          id="name-input"
          placeholder="What's your name?"
          maxlength="40"
          autocomplete="off"
        />
        <button id="name-save-btn" class="btn btn-primary btn-sm">Save</button>
        <button id="name-cancel-btn" class="btn btn-ghost btn-sm">Cancel</button>
      </div>
    </div>

    <div class="header-right">
      <p id="clock" class="clock-text">00:00:00</p>
      <!-- Light / Dark mode toggle -->
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark mode">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">Light Mode</span>
      </button>
    </div>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard-grid">

    <!-- === TO-DO LIST === -->
    <section class="card" id="todo-section">
      <h2 class="card-title">To-Do List</h2>

      <div class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a new task..."
          maxlength="120"
          autocomplete="off"
        />
        <button id="todo-add-btn" class="btn btn-primary">Add</button>
      </div>

      <ul id="todo-list" class="todo-list">
        <!-- tasks rendered by JS -->
      </ul>

      <p id="todo-empty" class="empty-msg">No tasks yet. Add one above!</p>
    </section>

    <!-- === FOCUS TIMER === -->
    <section class="card" id="timer-section">
      <h2 class="card-title">Focus Timer</h2>

      <!-- Custom duration row -->
      <div class="duration-row">
        <label for="timer-duration-input" class="duration-label">Duration (min)</label>
        <input
          type="number"
          id="timer-duration-input"
          class="duration-input"
          min="1"
          max="120"
          value="25"
          aria-label="Pomodoro duration in minutes"
        />
        <button id="timer-set-btn" class="btn btn-ghost btn-sm">Set</button>
      </div>

      <div class="timer-display">
        <span id="timer-minutes">25</span>:<span id="timer-seconds">00</span>
      </div>

      <p id="timer-status" class="timer-status-text">Ready to focus?</p>

      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop"  class="btn btn-secondary" disabled>Stop</button>
        <button id="timer-reset" class="btn btn-ghost">Reset</button>
      </div>

      <!-- Session counter -->
      <div class="session-counter">
        <span id="session-count">0</span> session<span id="session-plural">s</span> completed today
      </div>
    </section>

    <!-- === QUICK LINKS === -->
    <section class="card" id="links-section">
      <h2 class="card-title">Quick Links</h2>

      <div class="links-input-row">
        <input
          type="text"
          id="link-name-input"
          placeholder="Label"
          maxlength="30"
          autocomplete="off"
        />
        <input
          type="url"
          id="link-url-input"
          placeholder="https://..."
          maxlength="300"
          autocomplete="off"
        />
        <button id="link-add-btn" class="btn btn-primary">Add</button>
      </div>

      <div id="links-grid" class="links-grid">
        <!-- link buttons rendered by JS -->
      </div>

      <p id="links-empty" class="empty-msg">No links yet. Add your favourites!</p>
    </section>

  </main>

  <!-- ===== EDIT TASK MODAL ===== -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal">
      <h3 id="modal-title">Edit Task</h3>
      <input type="text" id="edit-input" maxlength="120" />
      <div class="modal-actions">
        <button id="edit-save-btn" class="btn btn-primary">Save</button>
        <button id="edit-cancel-btn" class="btn btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
